le style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Supply before</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">equation</td><td style="border:1px solid #9ca3af;padding:6px 10px;">P = 2 + 0.25Q</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">price_intercept</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">2</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Supply after</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">equation</td><td style="border:1px solid #9ca3af;padding:6px 10px;">P = 5 + 0.25Q</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">price_intercept</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Packaging cost rises by 3 per jar for every seller at every quantity; demand does not change.</li></ul></div>