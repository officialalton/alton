<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Given information</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Demand</td><td style="border:1px solid #9ca3af;padding:6px 10px;">P = 80 − 2Q</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Supply initial</td><td style="border:1px solid #9ca3af;padding:6px 10px;">P = 20 + 4Q</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Supply after change</td><td style="border:1px solid #9ca3af;padding:6px 10px;">P = 8 + 4Q</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Units</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">P</td><td style="border:1px solid #9ca3af;padding:6px 10px;">dollars per unit</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Q</td><td style="border:1px solid #9ca3af;padding:6px 10px;">units per period</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>The supply change is a shift of the supply curve; demand is unchanged.</li></ul></div>