<!doctype html><meta charset="utf-8"><title>run1:ap_microeconomics-c026-k3</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Features of the new Hillview Plaza open-air wireless network</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Feature</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Description</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Access</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Anyone in the plaza can connect; the city does not require payment or a login, and it cannot practically block any device</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Usage level</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Typically 40 devices connected; the network&#39;s capacity is 5,000 devices</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Effect of an additional user</td><td style="border:1px solid #9ca3af;padding:6px 10px;">At current usage, one more connected device does not reduce speed or quality for any other user</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Funding</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Paid for by the city through local taxes</td></tr></tbody></table></figure></body>
