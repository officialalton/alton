<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" style="max-width:100%;height:auto" role="img" aria-label="Energy bar charts for Initial and Final on the same scale, with bars for kinetic (K), gravitational (Ug), spring (Us) and internal (Eint) energy." font-family="Georgia, 'Times New Roman', serif"><line x1="20" y1="200" x2="350" y2="200" stroke="#111"/><rect x="30.0" y="200.0" width="32.0" height="0.0" fill="#999" stroke="#111"/><text x="46.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">K</text><rect x="65.0" y="20.0" width="32.0" height="180.0" fill="#999" stroke="#111"/><text x="81.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">Ug</text><rect x="100.0" y="200.0" width="32.0" height="0.0" fill="#999" stroke="#111"/><text x="116.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">Us</text><rect x="135.0" y="200.0" width="32.0" height="0.0" fill="#999" stroke="#111"/><text x="151.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">Eint</text><text x="100.0" y="228.0" font-size="11" text-anchor="middle" fill="#111">Initial</text><rect x="190.0" y="110.0" width="32.0" height="90.0" fill="#999" stroke="#111"/><text x="206.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">K</text><rect x="225.0" y="200.0" width="32.0" height="0.0" fill="#999" stroke="#111"/><text x="241.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">Ug</text><rect x="260.0" y="200.0" width="32.0" height="0.0" fill="#999" stroke="#111"/><text x="276.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">Us</text><rect x="295.0" y="110.0" width="32.0" height="90.0" fill="#999" stroke="#111"/><text x="311.0" y="213.0" font-size="10" text-anchor="middle" fill="#111">Eint</text><text x="260.0" y="228.0" font-size="11" text-anchor="middle" fill="#111">Final</text></svg>