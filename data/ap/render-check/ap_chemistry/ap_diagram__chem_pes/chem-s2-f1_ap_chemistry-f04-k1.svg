<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" style="max-width:100%;height:auto" role="img" aria-label="Photoelectron spectrum with 3 peaks on a logarithmic binding-energy axis with the highest energy at the left. Peaks (binding energy in MJ/mol, relative number of electrons): 28.6, 2; 1.72, 2; 1.09, 2. Peak heights are proportional to the relative number of electrons." font-family="Georgia, 'Times New Roman', serif"><line x1="48" y1="150" x2="348" y2="150" stroke="#111" stroke-width="1.5"/><line x1="48" y1="14" x2="48" y2="150" stroke="#111" stroke-width="1.5"/><line x1="48" y1="85.0" x2="348" y2="85.0" stroke="#ddd" stroke-width="0.6"/><text x="44" y="88.0" font-size="9" text-anchor="end" fill="#555">1</text><line x1="48" y1="20.0" x2="348" y2="20.0" stroke="#ddd" stroke-width="0.6"/><text x="44" y="23.0" font-size="9" text-anchor="end" fill="#555">2</text><text x="14" y="85" font-size="10" text-anchor="middle" fill="#111" transform="rotate(-90 14 85)">Relative number of electrons</text><line x1="87.7" y1="150" x2="87.7" y2="20.0" stroke="#111" stroke-width="3"/><line x1="277.5" y1="150" x2="277.5" y2="20.0" stroke="#111" stroke-width="3"/><line x1="308.3" y1="150" x2="308.3" y2="20.0" stroke="#111" stroke-width="3"/><line x1="87.7" y1="150" x2="87.7" y2="156" stroke="#888" stroke-width="0.8"/><text x="87.7" y="166" font-size="10" text-anchor="middle" fill="#111">28.6</text><line x1="277.5" y1="150" x2="277.5" y2="156" stroke="#888" stroke-width="0.8"/><text x="277.5" y="166" font-size="10" text-anchor="middle" fill="#111">1.72</text><line x1="308.3" y1="150" x2="308.3" y2="156" stroke="#888" stroke-width="0.8"/><text x="308.3" y="166" font-size="10" text-anchor="middle" fill="#111">1.09</text><text x="198" y="212" font-size="12" text-anchor="middle" fill="#111">Binding energy (MJ/mol, log scale)</text></svg>