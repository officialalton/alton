<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Given information</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Differential equation</td><td style="border:1px solid #9ca3af;padding:6px 10px;">dC/dt = -(1/2)(C − 2)</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Initial condition</td><td style="border:1px solid #9ca3af;padding:6px 10px;">C(0) = 10</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Table columns</td><td style="border:1px solid #9ca3af;padding:6px 10px;">C (mg/L), 0, 2, 6, 10</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Table title</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Selected concentration values</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Variables</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C</td><td style="border:1px solid #9ca3af;padding:6px 10px;">concentration in mg/L</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">t</td><td style="border:1px solid #9ca3a