<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Given information</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Differential equation</td><td style="border:1px solid #9ca3af;padding:6px 10px;">dB/dt = 0.05*B − 1200</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Initial condition</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">t</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">30,000</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Variables</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">t</td><td style="border:1px solid #9ca3af;padding:6px 10px;">years since loan began, t≥0</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B</td><td style="border:1px solid #9ca3af;padding:6px 10px;">balance in dollars</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Interest accrues continuously at 5% per year on the balance, and the household pays at a constant continuous rate of 1200 dollars per year.</li></ul></div>