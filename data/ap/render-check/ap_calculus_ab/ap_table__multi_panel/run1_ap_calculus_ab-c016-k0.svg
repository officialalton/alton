<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Given information</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Function</td><td style="border:1px solid #9ca3af;padding:6px 10px;">C&#39;(t) = (t² − 6t + 7) e^(-0.3 t)</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Domain</td><td style="border:1px solid #9ca3af;padding:6px 10px;">0 &lt; t &lt; 10</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Units</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">t</td><td style="border:1px solid #9ca3af;padding:6px 10px;">hours</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C</td><td style="border:1px solid #9ca3af;padding:6px 10px;">mg/L</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C&#39;</td><td style="border:1px solid #9ca3af;padding:6px 10px;">mg/L per hour</td></tr></tbody></table></figure></div>