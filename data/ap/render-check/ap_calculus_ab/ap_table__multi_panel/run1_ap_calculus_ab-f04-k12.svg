<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Given information</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">U</td><td style="border:1px solid #9ca3af;padding:6px 10px;">5+2*sin(x/2)</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">L</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1+x*(8-x)/4</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Domain</td><td style="border:1px solid #9ca3af;padding:6px 10px;">0, 8</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">X units</td><td style="border:1px solid #9ca3af;padding:6px 10px;">meters</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Y units</td><td style="border:1px solid #9ca3af;padding:6px 10px;">meters</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">X range</td><td style="border:1px solid #9ca3af;padding:6px 10px;">0, 8</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Y range</td><td style="border:1px solid #9ca3af;padding:6px 10px;">0, 8</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Curves</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">label</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">expr</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">ground surface U</td><td style="border:1px solid #9ca3af;padding:6px 10px;">5+2*sin(x/2)</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">bedrock L</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1+x*(8-x)/4</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>The curves intersect at two points x=a&lt;b in (0,8); a and b are found with a calculator. Between a and b, U(x)≥L(x). Length of the layer along the stream (perpendicular to the cross-section) is 10 m for part (c).</li></ul></div>