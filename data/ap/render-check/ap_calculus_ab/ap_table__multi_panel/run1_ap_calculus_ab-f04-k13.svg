<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Given information</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Variable</td><td style="border:1px solid #9ca3af;padding:6px 10px;">x = years since installation, 0 &lt;= x &lt;= 10</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Units</td><td style="border:1px solid #9ca3af;padding:6px 10px;">hundreds of dollars per year; areas in hundreds of dollars</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Volume context</td><td style="border:1px solid #9ca3af;padding:6px 10px;">A planter has a base in the xy-plane bounded by y=A(x) and y=B(x) on 0&lt;=x&lt;=k, where k is the positive crossing point; cross sections perpendicular to the x-axis are squares with a side on the base region. x and y in meters (use the same numeric values as the function values).</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Functions</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A</td><td style="border:1px solid #9ca3af;padding:6px 10px;">A(x) = 3 + 0.2x (hundreds of dollars per year)</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B</td><td style="border:1px solid #9ca3af;padding:6px 10px;">B(x) = 6*exp(-0.2x) + 1.5 (hundreds of dollars per year)</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Curve values</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Item</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Value</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A(0)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">3</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B(0)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">7.5</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A(10)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B(10)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">2.31</td></tr></tbody></table></figure></div>