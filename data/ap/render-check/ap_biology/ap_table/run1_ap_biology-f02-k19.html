le="border:1px solid #9ca3af;padding:6px 10px;">3</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Repressor site mutated</td><td style="border:1px solid #9ca3af;padding:6px 10px;">No</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">360</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">26</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">4</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Repressor site mutated</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Yes</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">410</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">34</td></tr></tbody></table><div style="font-size:12px;color:#374151;margin-top:4px">Units: RLU = relative luciferase units (arbitrary units, proportional to reporter transcription and translation)</div><ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Athletes&#39; muscles increase expression of an endurance-adaptation gene after training. In cultured muscle cells, the gene&#39;s promoter was fused to a luciferase reporter gene. Cells were treated for 6 h with either no signal or an energy-stress signal (a molecule that rises when ATP is low during exercise). The energy-stress signal activates a cytoplasmic enzyme that leads to a transcriptional activator entering the nucleus. A repressor protein binds a DNA site in the promoter. In two of the groups, this repressor-binding site was mutated so the repressor cannot bind. Each value is the mean of n = 6 cultures.</li></ul></figure></body>
