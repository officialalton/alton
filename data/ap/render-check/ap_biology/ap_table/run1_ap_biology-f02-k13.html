<!doctype html><meta charset="utf-8"><title>run1:ap_biology-f02-k13</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Relative maltase mRNA level (arbitrary units), mean ± 2SE, n = 6 cultures per cell</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Strain</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Glucose only</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Maltose only</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Glucose + maltose</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">S (standard)</td><td style="border:1px solid #9ca3af;padding:6px 10px;">4 ± 1</td><td style="border:1px solid #9ca3af;padding:6px 10px;">80 ± 6</td><td style="border:1px solid #9ca3af;padding:6px 10px;">6 ± 2</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">M (mutant)</td><td style="border:1px solid #9ca3af;padding:6px 10px;">70 ± 8</td><td style="border:1px solid #9ca3af;padding:6px 10px;">84 ± 7</td><td style="border:1px solid #9ca3af;padding:6px 10px;">72 ± 8</td></tr></tbody></table><div style="font-size:12px;color:#374151;margin-top:4px">Units: arbitrary units of relative mRNA</div><ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>A small brewery compares its standard yeast strain (S) with a supplier&#39;s mutant strain (M) before buying a large batch. The wort contains both glucose and maltose early in fermentation, and only maltose later. Maltase mRNA was measured after 2 hours in each medium. Strain M has a single-base-pair change in the DNA region upstream of the maltase gene where a glucose-activated repressor protein binds; the maltase coding sequence is identical in both strains.</li></ul></figure></body>
