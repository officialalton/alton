<!doctype html><meta charset="utf-8"><title>run1:ap_biology-c022-k7</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Surveillance of Staphylococcus isolates at one hospital (resistance to antibiotic X)</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Year</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Antibiotic X use (doses per 1000 patient-days)</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Isolates tested</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Resistant isolates</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Frequency of resistance allele r (haploid bacteria)</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">1</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">100</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">40</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.1</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">2</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">300</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">100</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.25</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">3</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">500</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">180</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.45</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">4</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">500</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">220</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.55</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">5</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">150</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">130</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.33</td></tr></tbody></table><ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Bacteria are haploid; each isolate carries either allele r (resistant) or R+ (susceptible), so allele frequency equals the fraction of resistant isolates.</li><li>Resistance to X is caused by a single gene, mecX, encoding a drug-modifying enzyme.</li><li>Sequencing: the mecX gene in Lineage A and Lineage B, which are two distantly related Staphylococcus lineages, is 99% identical in sequence, while their core genomes are only 85% identical.</li><li>Mutation rate at mecX is the same in all years and is far too low to account for the yearly changes in frequency.</li><li>Year 1 to Year 4 antibiotic use rises then is reduced in Year 5; no resistant patients were transferred in from other hospitals.</li></ul></figure></body>
