<!doctype html><meta charset="utf-8"><title>run1:ap_biology-f03-k11</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Mean reaction time to a visual light stimulus before and after a 5-day protocol</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Group</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Treatment for 5 days</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Mean reaction time before (ms)</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Mean reaction time after (ms)</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A</td><td style="border:1px solid #9ca3af;padding:6px 10px;">8 h sleep, no training</td><td style="border:1px solid #9ca3af;padding:6px 10px;">251 ± 8</td><td style="border:1px solid #9ca3af;padding:6px 10px;">249 ± 8</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B</td><td style="border:1px solid #9ca3af;padding:6px 10px;">5 h sleep, no training</td><td style="border:1px solid #9ca3af;padding:6px 10px;">250 ± 9</td><td style="border:1px solid #9ca3af;padding:6px 10px;">284 ± 10</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C</td><td style="border:1px solid #9ca3af;padding:6px 10px;">5 h sleep + training game</td><td style="border:1px solid #9ca3af;padding:6px 10px;">252 ± 8</td><td style="border:1px solid #9ca3af;padding:6px 10px;">262 ± 9</td></tr></tbody></table><div style="font-size:12px;color:#374151;margin-top:4px">Units: milliseconds (ms)</div><ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>60 volunteer student athletes (ages 16-18) were randomly assigned to three groups of 20. Each athlete sat in the same quiet room and pressed a button as fast as possible when a green LED lit at random intervals; 30 trials per test, mean of the 30 trials recorded per athlete. Group A: normal sleep (8 h/night) for 5 days. Group B: restricted sleep (5 h/night) for 5 days. Group C: restricted sleep (5 h/night) for 5 days plus a 10-minute daily reaction-training game on a tablet.</li></ul></figure></body>
