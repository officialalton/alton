<!doctype html><meta charset="utf-8"><title>run1:ap_biology-f02-k16</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Strain</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Without IPTG</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">With IPTG</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A: wild-type regulatory region</td><td style="border:1px solid #9ca3af;padding:6px 10px;">12 +/- 3</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1480 +/- 90</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B: operator mutation</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1350 +/- 110</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1420 +/- 100</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C: repressor cannot bind DNA</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1390 +/- 95</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1450 +/- 85</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">D: no plasmid</td><td style="border:1px solid #9ca3af;padding:6px 10px;">2 +/- 1</td><td style="border:1px solid #9ca3af;padding:6px 10px;">2 +/- 1</td></tr></tbody></table><div style="font-size:12px;color:#374151;margin-top:4px">Units: Miller units</div><ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Researchers built reporter plasmids in which a bacterial regulatory region drives the lacZ gene (encodes beta-galactosidase). Plasmids were introduced by transformation into E. coli strains lacking their own lac operon. Strain A: plasmid with wild-type promoter and operator. Strain B: plasmid with a mutation in the operator sequence only. Strain C: plasmid with wild-type promoter and operator, in a host that also carries a mutation in the gene for the repressor protein that prevents the repressor from binding IPTG-independent DNA (repressor cannot bind DNA). Strain D: untransformed host (no plasmid). IPTG is an inducer that binds the repressor and prevents it from binding DNA. All cultures were grown in medium with glycerol as carbon source (no glucose).</li></ul></figure></body>
