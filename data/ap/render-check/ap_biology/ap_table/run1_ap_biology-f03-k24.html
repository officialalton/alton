<!doctype html><meta charset="utf-8"><title>run1:ap_biology-f03-k24</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Treatment</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Sea stars able to enter</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Mussel cover (%)</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Mussel ±2SE</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Barnacle cover (%)</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Barnacle ±2SE</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A: full cage</td><td style="border:1px solid #9ca3af;padding:6px 10px;">No</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">78</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">6</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">3</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B: cage control (open sides)</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Yes</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">24</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">28</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">6</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C: uncaged</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Yes</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">22</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">30</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">6</td></tr></tbody></table><ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Field study on a wave-exposed rocky shore. Eighteen 1 m x 1 m plots were chosen at the same tidal height and similar slope. Plots were randomly assigned (6 each) to three treatments. Treatment A, full cage: metal mesh cage that keeps out sea stars (a predator that eats mussels). Treatment B, cage control: cage with open sides, which has the same shading and wave-reduction as a full cage but lets sea stars enter. Treatment C, uncaged: plot marked with bolts only. At the start all plots had mussel cover of about 20 percent and barnacle cover of about 30 percent. Percent cover was measured after 12 months.</li></ul></figure></body>
