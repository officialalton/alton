<!doctype html><meta charset="utf-8"><title>run1:ap_biology-c018-k1</title><body style="font-family:Georgia,serif;margin:16px;background:#fff;color:#111"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Print-shop model of copying a two-strand master scroll</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Model feature</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Observation in the print shop</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Master scroll</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Two strips taped together; the strips are pulled apart just ahead of the copier</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Copy machine</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Can only print by moving in one direction along a strip (toward the open end where strips are separating) for the strip it faces in that direction</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Strip A (copier follows the opening)</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Copied in one continuous run</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Strip B (copier must move away from the opening)</td><td style="border:1px solid #9ca3af;padding:6px 10px;">Copied in separate short segments; each segment starts with a small sticker label that is later removed, gaps are filled, and segments are taped together</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Each finished copy</td><td style="border:1px solid #9ca3af;padding:6px 10px;">One original strip plus one newly printed strip</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Window of strip pulled apart in this trial</td><td style="border:1px solid #9ca3af;padding:6px 10px;">1,200 units long</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Length of each short segment on Strip B</td><td style="border:1px solid #9ca3af;padding:6px 10px;">200 units</td></tr></tbody></table></figure></body>
