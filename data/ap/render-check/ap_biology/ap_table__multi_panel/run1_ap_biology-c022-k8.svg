<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Snail samples (one generation, each island). Dark shell is the recessive phenotype (genotype bb); light shell is B_ (dominant). Assume each island sample is a random sample of a population in Hardy-Weinberg equilibrium at the time of sampling.</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Island</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Snails sampled</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Dark-shelled snails</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">64</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">36</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">C</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">400</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">100</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Island A only: survival to breeding age (thrush predation on pale soil)</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Phenotype</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Proportion surviving to breed</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Light</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.5</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Dark</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.8</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Cytochrome b sequence divergence (% of sites differing)</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Island pair</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Divergence (%)</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A-B</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.4</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A-C</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">2.8</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">B-C</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">2.9</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Cross-mating trials (40 pairs each) between snails from different islands</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Cross</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Pairs tested</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Pairs producing fertile offspring</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A x B</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">40</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">36</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">A x C</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">40</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">2</td></tr></tbody></table></figure></div>