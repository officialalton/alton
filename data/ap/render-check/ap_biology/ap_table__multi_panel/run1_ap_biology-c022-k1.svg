<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><div style="font-weight:700">Aphid control records at Marlow Greenhouse (sprayed every season with insecticide Z; same dose each time)</div><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Table1</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Season</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Percent of aphids surviving a spray</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Percent of sampled aphids carrying resistance allele R</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">1</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">4</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">2</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">2</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">9</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">3</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">21</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">12</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">4</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">40</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">26</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">5</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">63</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">47</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">6</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">81</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">69</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Same detox gene, partial DNA comparison to the Marlow aphid (percent identical bases over 1,000 bases)</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Species</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Percent identity</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Aphid species B (garden pest, same genus)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">98</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Aphid species C (different genus, same family)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">93</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Whitefly (different order)</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">81</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Aphids reproduce asexually in summer but mix alleles through sexual reproduction each autumn. Resistance to Z is due to allele R of a gene encoding a detoxifying enzyme. In untreated greenhouses nearby, R stays near 2% of aphids. Aphids with R grow slightly slower and lay about 10% fewer eggs when Z is absent.</li></ul></div>