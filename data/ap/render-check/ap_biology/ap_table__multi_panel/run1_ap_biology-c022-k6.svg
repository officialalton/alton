<div class="ap-table-set" style="display:flex;flex-direction:column;gap:14px;max-width:100%"><div style="font-weight:700">Simulation of a self-copying sequence population (locus with alleles A and a; no mutation, no migration, population size 10000, random mating)</div><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Table1 relative fitness</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Genotype</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Relative fitness</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">AA</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">1</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Aa</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">1</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">aa</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.6</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Table2 frequency of A</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Generation</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Frequency of A (p)</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">0</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.5</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">1</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.58</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">2</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.65</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">3</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">0.71</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Table3 pairwise differences per 100 sites</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Column 1</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Column 2</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">X vs Y</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">4</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">X vs Z</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">12</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Y vs Z</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">12</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Each difference is a site at which the two sequences differ; differences accumulate at a constant rate per lineage.</li></ul></div>