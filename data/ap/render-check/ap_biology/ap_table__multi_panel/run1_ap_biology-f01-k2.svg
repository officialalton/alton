r-nums">6</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">8</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">25</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">5</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Table 2. Unsynchronized culture, 500 cells sampled, total cell cycle length = 20 h</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Phase</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Number of cells</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">G1</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">275</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">S</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">125</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">G2</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">75</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">M</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">25</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>Cells enter mitosis when cyclin B level is highest. Assume every cell cycles at the same rate and the number of cells in a phase is proportional to the duration of that phase.</li></ul></div>