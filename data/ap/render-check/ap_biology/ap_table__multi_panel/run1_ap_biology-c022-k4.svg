ft;font-weight:600;padding-bottom:6px">Mean generation time (minutes) of pure cultures</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Cell type</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">No drug X</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Low-dose drug X</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Susceptible</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">30</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">95</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Resistant</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">36</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">38</td></tr></tbody></table></figure><figure style="margin:0"><table style="border-collapse:collapse;font-size:14px;max-width:100%"><caption style="caption-side:top;text-align:left;font-weight:600;padding-bottom:6px">Percent identity of the rpsL gene sequence (ancestral strain compared with each)</caption><thead><tr><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Organism</th><th scope="col" style="border:1px solid #6b7280;padding:6px 10px;background:#f3f4f6;text-align:left;font-weight:600">Percent identity</th></tr></thead><tbody><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Salmonella enterica</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">96</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Vibrio cholerae</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">88</td></tr><tr><td style="border:1px solid #9ca3af;padding:6px 10px;">Bacillus subtilis</td><td style="border:1px solid #9ca3af;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">74</td></tr></tbody></table></figure><ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:#374151"><li>All flasks started from one ancestral culture; the resistance allele was present before drug exposure; medium and temperature were identical across flasks.</li></ul></div>