<h2>비밀번호 재설정</h2>

<p>아래 버튼을 눌러 새 비밀번호를 설정하세요.</p>

<p><a href="{{ .SiteURL }}/set-password?token_hash={{ .TokenHash }}&type=recovery">비밀번호 재설정하기</a></p>

<p>버튼이 동작하지 않으면 아래 링크를 복사해 브라우저 주소창에 붙여넣으세요:</p>
<p>{{ .SiteURL }}/set-password?token_hash={{ .TokenHash }}&type=recovery</p>

<p>이 요청을 하지 않으셨다면 이 이메일을 무시하세요.</p>
